const pad=n=>String(n).padStart(2,"0");
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function dayName(s){return new Intl.DateTimeFormat("es-ES",{weekday:"long"}).format(parseISO(s))}
function prettyDate(s,long=true){return new Intl.DateTimeFormat("es-ES",long?{weekday:"long",day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"short"}).format(parseISO(s))}
function inRange(s,a,b){return s>=a&&s<=b}
function isNonTeaching(s){
  const d=parseISO(s), wd=d.getDay(); if(wd===0||wd===6) return true;
  if(s<BASE_CALENDAR.start||s>BASE_CALENDAR.end) return true;
  if(BASE_CALENDAR.holidays.includes(s)||state.extraNonTeachingDates.includes(s)) return true;
  return BASE_CALENDAR.vacations.some(([a,b])=>inRange(s,a,b));
}
function termForDate(s){return BASE_CALENDAR.terms.find(t=>inRange(s,t.start,t.end))?.id || (s<BASE_CALENDAR.start?"T1":"T3")}
function subjectClass(k){return SUBJECTS[k]?.css||""}
function getScheduleForDate(s){
  if(isNonTeaching(s)) return [];
  const wd=parseISO(s).getDay(); return (FULL_TIMETABLE[wd]||[]).filter(x=>SUBJECTS[x[2]]).map((x,i)=>({time:x[0],end:x[1],subject:x[2],label:x[3],slot:i}));
}
function allTeachingDates(){let out=[];for(let s=BASE_CALENDAR.start;s<=BASE_CALENDAR.end;s=addDays(s,1)) if(!isNonTeaching(s)) out.push(s);return out}
function buildSchedules(){

  for(const d of allTeachingDates()) for(const s of getScheduleForDate(d)){ schedules[s.subject].push({...s,date:d,id:`${s.subject}-${d}-${s.time}`}); }
}

function sectionAt(sections,page){let label=sections[0]?.[1]||"";for(const [p,t] of sections){if(p<=page)label=t;else break}return label}
function nextSectionStart(sections,page,end){for(const [p] of sections){if(p>page)return p}return end+1}
function pageRef(mode,a,b){const n=a===b?`p. ${a}`:`pp. ${a}–${b}`;return mode==="workbook"?`Cuaderno de actividades: ${n} (repaso tras acabar la unidad)`:`Libro del alumno: ${n}`}
function buildContentPlan(subject){
  const out=[];
  CURRICULUM[subject].forEach((unit,unitIndex)=>{
    // Libro del alumno: agrupación máxima de 2 páginas y sin mezclar apartados.
    for(let p=unit.bookStart;p<=unit.bookEnd;){
      const topic=sectionAt(unit.sections,p); const next=nextSectionStart(unit.sections,p,unit.bookEnd); const end=Math.min(unit.bookEnd,next-1,p+1);
      out.push({type:"book",unit:unitIndex,unitTitle:unit.title,topic,phase:1,bookPageStart:p,bookPageEnd:end,workbookPageStart:null,workbookPageEnd:null,reference:pageRef("book",p,end)});
      p=end+1;
    }
    // El cuaderno se usa únicamente al terminar la unidad, como repaso.
    // En Valencià y Medi agrupamos varias páginas contiguas de repaso para que la secuencia
    // anual complete todo el libro sin convertir el cuaderno complementario en el eje de la programación.
    const wbChunk=subject==="medi"?5:subject==="val"?5:2;
    for(let p=unit.workbookStart;p<=unit.workbookEnd;){
      let end,topic;
      if(wbChunk>2){
        end=Math.min(unit.workbookEnd,p+wbChunk-1);
        const firstTopic=sectionAt(unit.workbookSections,p),lastTopic=sectionAt(unit.workbookSections,end);
        topic=firstTopic===lastTopic?firstTopic:(SUBJECTS[subject].lang==="va"?`Repàs global de la unitat: ${firstTopic} → ${lastTopic}`:`Repaso global de la unidad: ${firstTopic} → ${lastTopic}`);
      }else{
        const firstTopic=sectionAt(unit.workbookSections,p),next=nextSectionStart(unit.workbookSections,p,unit.workbookEnd);
        end=Math.min(unit.workbookEnd,next-1,p+1);
        topic=firstTopic;
      }
      out.push({type:"workbook",unit:unitIndex,unitTitle:unit.title,topic:`${SUBJECTS[subject].lang==="va"?"Repàs":"Repaso"}: ${topic}`,phase:1,bookPageStart:null,bookPageEnd:null,workbookPageStart:p,workbookPageEnd:end,reference:pageRef("workbook",p,end)});
      p=end+1;
    }
  });
  return out;
}
function findAnchorContentIndex(content,a){return content.findIndex(c=>a.mode==="book"?c.type==="book"&&c.bookPageStart<=a.page&&c.bookPageEnd>=a.page:c.type==="workbook"&&c.workbookPageStart<=a.page&&c.workbookPageEnd>=a.page)}
function historyContent(subject){return {type:"history",unit:0,unitTitle:"Inicio de curso",topic:SUBJECTS[subject].lang==="va"?"Treball previ segons el ritme real de la classe":"Trabajo previo según el ritmo real de la clase",phase:1,reference:"Histórico previo al punto de anclaje del 7/10/2026"}}
function buildPlans(){
  buildSchedules(); plans={};
  for(const k of Object.keys(SUBJECTS)){
    const content=buildContentPlan(k),slots=schedules[k],anchor=PROGRESS_ANCHORS[k];
    const anchorSlot=slots.findIndex(x=>x.date===anchor.date&&x.time===anchor.time);
    const anchorContent=findAnchorContentIndex(content,anchor);
    const offset=(anchorSlot>=0&&anchorContent>=0)?anchorContent-anchorSlot:0;
    plans[k]=slots.map((slot,i)=>{
      const ci=i+offset; let c;
      if(ci<0)c=historyContent(k); else c=content[ci];
      if(!c){const last=CURRICULUM[k].at(-1);c={type:"buffer",unit:CURRICULUM[k].length-1,unitTitle:last.title,topic:SUBJECTS[k].lang==="va"?"Sessió flexible: reforç, recuperació o ampliació":"Sesión flexible: refuerzo, recuperación o ampliación",phase:1,reference:"Sin páginas nuevas: sesión flexible"}}
      return {...slot,...c,baseIndex:i,contentIndex:ci,sessionNo:i+1};
    });
  }
  buildAdaptiveMaps();
}
function pickContent(l){return {type:l.type,unit:l.unit,unitTitle:l.unitTitle,topic:l.topic,phase:l.phase,bookPageStart:l.bookPageStart,bookPageEnd:l.bookPageEnd,workbookPageStart:l.workbookPageStart,workbookPageEnd:l.workbookPageEnd,reference:l.reference}}
function lowPriorityLesson(l){
  if(!l)return false;
  if(l.type==="workbook"||l.type==="buffer")return true;
  return /reto inicial|repte inicial|qué sabemos|què en sabem|por dónde empezamos|per on comencem|qué hemos aprendido|què hem aprés|tarea final|tasca final/i.test(l.topic||"");
}
function canCompactLessons(a,b,debt){
  if(!a||!b||a.type==="history"||b.type==="history"||a.type==="buffer"||b.type==="buffer")return false;
  if(a.unit!==b.unit)return false;
  if(a.type==="workbook"&&b.type==="workbook")return debt>=2;
  if(a.type==="book"&&b.type==="book"&&a.topic===b.topic)return debt>=2;
  if(debt>=3&&(lowPriorityLesson(a)||lowPriorityLesson(b)))return true;
  return debt>=5&&a.type==="book"&&b.type==="book";
}
function compactReference(a,b,subject){
  const va=SUBJECTS[subject].lang==="va";
  if(a.type===b.type&&a.type==="book"&&a.bookPageStart!=null&&b.bookPageEnd!=null){
    return `${va?"Llibre de l’alumnat":"Libro del alumno"}: pp. ${a.bookPageStart}–${b.bookPageEnd} · ${va?"selecció essencial per recuperar ritme":"selección esencial para recuperar ritmo"}`;
  }
  if(a.type===b.type&&a.type==="workbook"&&a.workbookPageStart!=null&&b.workbookPageEnd!=null){
    return `${va?"Quadern d’activitats":"Cuaderno de actividades"}: pp. ${a.workbookPageStart}–${b.workbookPageEnd} · ${va?"repàs compactat":"repaso compactado"}`;
  }
  return `${a.reference} + ${b.reference}`;
}
function mergeCompactLesson(baseSlot,a,b,debt){
  const va=SUBJECTS[baseSlot.subject].lang==="va";
  const sameTopic=a.topic===b.topic;
  const topic=sameTopic?a.topic:`${va?"Sessió compacta":"Sesión compacta"}: ${a.topic} + ${b.topic}`;
  return {...baseSlot,...pickContent(a),topic,reference:compactReference(a,b,baseSlot.subject),compact:true,compactDebt:debt,mergedTopics:[a.topic,b.topic],
    bookPageStart:a.type==="book"?a.bookPageStart:null,bookPageEnd:(a.type==="book"&&b.type==="book")?b.bookPageEnd:a.bookPageEnd,
    workbookPageStart:a.type==="workbook"?a.workbookPageStart:null,workbookPageEnd:(a.type==="workbook"&&b.type==="workbook")?b.workbookPageEnd:a.workbookPageEnd};
}
function aiDebtForLessonStatus(st,adj){
  if(!adj?.accepted||!adj.shift_content)return 0;
  const status=st?.status||"pending";
  if(status==="missed")return 0;      // una sesión perdida ya genera 1 sesión de deuda
  if(status==="partial")return .5;    // completa la media sesión que ya falta
  return 1;                           // sesión dada pero necesita una sesión completa extra de refuerzo
}
function buildAdaptiveMaps(){
  adaptiveMaps={};
  const today=schoolTodayISO();
  for(const subject of Object.keys(SUBJECTS)){
    const base=plans[subject]||[],map=new Map();let debt=0;
    for(let i=0;i<base.length;i++){
      const slot=base[i],debtInt=Math.floor(debt+.001),idx=Math.max(0,i-debtInt),source=base[idx]||base.at(-1);
      let adjusted={...slot,...pickContent(source),debt:debtInt,compact:false};
      const st=state.lessonStatus[slot.id]||{status:"pending"};
      if(slot.date>=today&&debtInt>=2){
        const second=base[idx+1];
        if(canCompactLessons(source,second,debtInt))adjusted=mergeCompactLesson({...slot,debt:debtInt},source,second,debtInt);
      }
      map.set(slot.id,adjusted);
      const anchor=PROGRESS_ANCHORS[subject],afterAnchor=slot.date>anchor.date||(slot.date===anchor.date&&slot.time>=anchor.time);
      if(afterAnchor){
        if(st.status==="missed")debt+=1;
        else if(st.status==="partial")debt+=.5;
        else if(st.status==="done")debt=Math.max(0,debt-(Number(st.compactCredit)||0));
        else if(st.status==="pending"&&slot.date>=today&&adjusted.compact)debt=Math.max(0,debt-1);
        debt+=aiDebtForLessonStatus(st,state.aiAdjustments?.[slot.id]);
      }
    }
    adaptiveMaps[subject]=map;
  }
}
function backlogBefore(subject,date){
  let debt=0;
  for(const l of plans[subject]||[]){
    if(l.date>=date)break;
    const st=state.lessonStatus[l.id]||{},anchor=PROGRESS_ANCHORS[subject],afterAnchor=l.date>anchor.date||(l.date===anchor.date&&l.time>=anchor.time);
    if(!afterAnchor)continue;
    if(st.status==="missed")debt+=1;
    if(st.status==="partial")debt+=.5;
    if(st.status==="done"&&st.compactCredit)debt=Math.max(0,debt-Number(st.compactCredit));
    debt+=aiDebtForLessonStatus(st,state.aiAdjustments?.[l.id]);
  }
  return Math.floor(debt+.001);
}
function effectiveLesson(baseLesson){if(!baseLesson)return null;return adaptiveMaps[baseLesson.subject]?.get(baseLesson.id)||{...baseLesson,debt:0,compact:false}}
function findBaseLessonById(id){for(const k of Object.keys(plans)){const x=plans[k].find(l=>l.id===id);if(x)return x}return null}
function nextCarryTargetId(sourceId){
  const src=findBaseLessonById(sourceId);if(!src)return null;
  const arr=plans[src.subject]||[],idx=arr.findIndex(x=>x.id===sourceId);if(idx<0)return null;
  for(let i=idx+1;i<arr.length;i++){if((state.lessonStatus[arr[i].id]?.status||"pending")!=="missed")return arr[i].id}
  return null;
}
function carryoversForLesson(l){

    if(!st?.carryForward||!String(st.carryText||"").trim())continue;
    const src=findBaseLessonById(sourceId);if(!src||src.subject!==l.subject)continue;
    if(nextCarryTargetId(sourceId)===l.id)out.push({sourceId,text:String(st.carryText).trim(),date:src.date});
  }
  return out;
}
function carryNotice(l){const c=carryoversForLesson(l);if(!c.length)return "";const va=SUBJECTS[l.subject].lang==="va";return `<div class="notice" style="margin:10px 0"><b>➡️ ${va?"Pendent de la sessió anterior":"Pendiente de la sesión anterior"}:</b><br>${c.map(x=>esc(x.text)).join("<br>")}<div class="tiny" style="margin-top:5px">${va?"Prioritat: acabar-ho abans d’iniciar activitats noves no essencials.":"Prioridad: terminarlo antes de iniciar actividades nuevas no esenciales."}</div></div>`}

function objectiveFor(l){const va=SUBJECTS[l.subject].lang==="va";if(l.compact)return va?`Recuperar ritme sense perdre els aprenentatges essencials: treballar els conceptes clau de «${l.mergedTopics?.join(" + ")||l.topic}», seleccionant només les activitats necessàries per comprovar la comprensió.`:`Recuperar ritmo sin perder los aprendizajes esenciales: trabajar los conceptos clave de «${l.mergedTopics?.join(" + ")||l.topic}», seleccionando solo las actividades necesarias para comprobar la comprensión.`;if(l.type==="workbook")return va?`Consolidar «${l.topic.replace(/^Repàs:\s*/,"")}» després d’haver acabat la unitat i detectar errors que cal reforçar.`:`Consolidar «${l.topic.replace(/^Repaso:\s*/,"")}» después de haber terminado la unidad y detectar errores que conviene reforzar.`;if(l.type==="history")return va?"Mantindre el registre del treball ja realitzat abans del punt de partida actual.":"Mantener el registro del trabajo ya realizado antes del punto de partida actual.";if(l.type==="buffer")return va?"Recuperar continguts pendents, reforçar dificultats o ampliar segons les evidències del grup.":"Recuperar contenidos pendientes, reforzar dificultades o ampliar según las evidencias del grupo.";return va?`Comprendre i aplicar «${l.topic}» treballant directament les pàgines indicades del llibre de l’alumnat i resolent les activitats en la llibreta.`:`Comprender y aplicar «${l.topic}» trabajando directamente las páginas indicadas del libro del alumno y resolviendo las actividades en la libreta.`}
function indicatorsFor(l){const t=l.topic.replace(/^Repaso:\s*|^Repàs:\s*/,"");if(l.subject==="math")return [`Resuelve actividades relacionadas con «${t}» y explica el procedimiento.`,`Detecta errores y comprueba si el resultado es razonable.`];if(l.subject==="medi")return [`Identifica les idees clau de «${t}».`,`Relaciona els conceptes i els aplica a exemples o situacions pròximes.`];if(l.subject==="val")return [`Reconeix i usa adequadament els continguts de «${t}».`,`Justifica la resposta amb vocabulari lingüístic apropiat.`];return [`Reconoce y utiliza adecuadamente los contenidos de «${t}».`,`Justifica la respuesta con vocabulario lingüístico apropiado.`]}
function saberFor(l){const va=SUBJECTS[l.subject].lang==="va";return va?`Saber de la sessió: ${l.topic}. Situació d’aprenentatge «${l.unitTitle}».`:`Saber de la sesión: ${l.topic}. Situación de aprendizaje «${l.unitTitle}».`}

function lessonCard(l){

window.changeDay=n=>{state.selectedDate=addDays(state.selectedDate,n);renderToday()};window.selectDate=s=>{state.selectedDate=s;renderToday()};
function subjectProgress(k){const today=schoolTodayISO();const arr=plans[k];const idx=arr.filter(x=>x.date<=today).length;return{k,pct:Math.min(100,Math.round(idx/arr.length*100))}}
function debtSummary(){const rows=Object.keys(SUBJECTS).map(k=>{const d=backlogBefore(k,addDays(state.selectedDate,1));return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="subject-chip ${SUBJECTS[k].css}">${SUBJECTS[k].short}</span><b>${d?`+${d} sesión${d>1?'es':''} a recuperar`:'En ritmo previsto'}</b></div>`}).join('');return `<p class="small muted">Una sesión no realizada desplaza el contenido; dos parciales equivalen aproximadamente a una sesión. Si el desfase llega a 2 o más sesiones, la app activa recuperación adaptativa: compacta primero repasos/cuaderno y bloques repetidos; con retrasos muy altos puede unir dos bloques esenciales consecutivos de la misma unidad, seleccionando solo las actividades clave. Nunca elimina silenciosamente un contenido del libro.</p>${rows}`}

 const term=state.selectedTerm;setHeader("Informes y notas",`Cálculo orientativo · ${BASE_CALENDAR.terms.find(t=>t.id===term).name}`);const k=state.selectedSubject;view.innerHTML=`<div class="card"><div class="tabs">${Object.keys(SUBJECTS).map(s=>`<button class="${s===k?'active':''}" onclick="reportSubject('${s}')">${SUBJECTS[s].name}</button>`).join('')}</div><div class="tabs">${BASE_CALENDAR.terms.map(t=>`<button class="${t.id===term?'active':''}" onclick="reportTerm('${t.id}')">${t.name}</button>`).join('')}</div><div class="notice">La nota es una <b>propuesta orientativa</b> calculada con las evidencias registradas. El docente mantiene siempre la decisión final. Pesos actuales: dominio ${state.weights.mastery}% · trabajo diario registrado ${state.weights.completion}%.</div><div class="grid cols-3" style="margin-top:14px">${STUDENTS.map((s,i)=>reportStudentCard(k,term,i,s)).join('')}</div><div style="margin-top:14px"><button class="btn" onclick="exportCSV('${k}','${term}')">⬇ Exportar CSV</button></div></div>`
}
window.reportSubject=k=>{state.selectedSubject=k;renderReports()};window.reportTerm=t=>{state.selectedTerm=t;renderReports()};
function calcStudent(k,term,studentIndex){const lessonIds=plans[k].filter(l=>termForDate(l.date)===term).map(l=>l.id);let levels=[],done=0,eligible=0;for(const id of lessonIds){const e=state.evidence[id]?.[studentIndex];if(!e)continue;if(e.completion!=="absent"){eligible++;if(e.completion==="done")done++}if(Number.isFinite(e.level)&&e.level>0)levels.push(e.level)}const mastery=levels.length?levels.reduce((a,b)=>a+b,0)/levels.length/3*10:null;const comp=eligible?done/eligible*10:null;let score=null;if(mastery!==null||comp!==null){const mw=state.weights.mastery/100,cw=state.weights.completion/100;let num=0,den=0;if(mastery!==null){num+=mastery*mw;den+=mw}if(comp!==null){num+=comp*cw;den+=cw}score=num/den}return{mastery,comp,score,levels:levels.length,done,eligible}}
function reportStudentCard(k,t,i,name){const x=calcStudent(k,t,i);const score=x.score===null?"—":x.score.toFixed(1);return `<div class="report-card"><div class="small muted">${i+1}. ${esc(name)}</div><div class="report-score">${score}</div><div class="kpis"><span class="kpi">Evidencias ${x.levels}</span><span class="kpi">Trabajo ${x.done}/${x.eligible}</span></div><button class="btn" style="margin-top:10px" onclick="openReport('${k}','${t}',${i})">Ver informe</button></div>`}

function gameHTML(l,questions,source="ai"){const va=SUBJECTS[l.subject].lang==="va";window.__activeGame={lessonId:l.id,questions,answers:{},score:0,answered:0,source};return `<div class="game-shell"><div class="game-top"><div><span class="subject-chip ${SUBJECTS[l.subject].css}">${SUBJECTS[l.subject].name}</span> <span class="ai-badge">${source==='ai'?'✨ Joc nou generat amb IA / Juego nuevo con IA':'↩ Juego local de respaldo'}</span><h2 style="margin:8px 0 4px">${esc(l.topic)}</h2><div class="source-ref">${esc(referenceFor(l))} · ${esc(l.unitTitle)}</div></div><div class="game-score" id="gameScore">0 / ${questions.length}</div></div><div class="touch-hint">👆 ${va?"Toca les respostes. Cada vegada que premes «Un altre joc» la IA crea preguntes noves.":"Toca las respuestas. Cada vez que pulses «Otro juego» la IA crea preguntas nuevas."}</div><div class="game-progress" id="gameProgress">${questions.map(()=>`<span class="game-dot"></span>`).join("")}</div>${questions.map((x,i)=>x.type==="match"?matchHTML(x,i):choiceHTML(x,i)).join("")}<div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn primary" onclick="resetGame()">✨ ${va?"Un altre joc":"Otro juego"}</button></div></div>`}
function choiceHTML(x,i){return `<div class="game-card" id="gcard-${i}"><div class="game-q"><span class="tag">${i+1}</span> ${esc(x.prompt)}</div><div class="game-options">${x.options.map((o,j)=>`<button class="game-option" onclick="answerGame(${i},${j},this)">${esc(o)}</button>`).join("")}</div><div class="game-feedback" id="gfb-${i}"></div></div>`}
function matchHTML(x,i){const order=x.pairs.map((_,j)=>x.pairs.length-1-j);return `<div class="game-card" id="gcard-${i}"><div class="game-q"><span class="tag">${i+1}</span> ${esc(x.prompt)}</div><div class="match-wrap"><div class="match-col">${x.pairs.map((p,j)=>`<button class="match-btn" id="ml-${i}-${j}" onclick="selectMatch(${i},'L',${j},this)">${esc(p[0])}</button>`).join("")}</div><div class="match-col">${order.map(orig=>`<button class="match-btn" id="mr-${i}-${orig}" onclick="selectMatch(${i},'R',${orig},this)">${esc(x.pairs[orig][1])}</button>`).join("")}</div></div><div class="game-feedback" id="gfb-${i}"></div></div>`}
window.answerGame=(qi,oi,btn)=>{const g=window.__activeGame,qx=g?.questions?.[qi];if(!qx||g.answers[qi]!=null)return;const ok=oi===qx.answer;g.answers[qi]=ok;g.answered++;if(ok)g.score++;const card=document.getElementById(`gcard-${qi}`);card.querySelectorAll('.game-option').forEach((b,j)=>{b.disabled=true;if(j===qx.answer)b.classList.add('correct');else if(j===oi&&!ok)b.classList.add('wrong')});document.getElementById(`gfb-${qi}`).textContent=ok?'✅ ¡Correcto!':`❌ ${qx.explanation||'Revisa el contenido y vuelve a intentarlo en la siguiente ronda.'}`;updateGameScore(qi,ok)};
window.selectMatch=(qi,side,idx,btn)=>{const g=window.__activeGame,qx=g?.questions?.[qi];if(!qx||g.answers[qi]!=null)return;g.match=g.match||{};g.match[qi]=g.match[qi]||{left:null,right:null,matched:new Set()};const m=g.match[qi];if(m.matched.has(idx))return;if(side==='L'){document.querySelectorAll(`[id^="ml-${qi}-"]`).forEach(b=>!b.classList.contains('matched')&&b.classList.remove('selected'));m.left=idx;btn.classList.add('selected')}else{document.querySelectorAll(`[id^="mr-${qi}-"]`).forEach(b=>!b.classList.contains('matched')&&b.classList.remove('selected'));m.right=idx;btn.classList.add('selected')}if(m.left!=null&&m.right!=null){const lb=document.getElementById(`ml-${qi}-${m.left}`),rb=document.getElementById(`mr-${qi}-${m.right}`);if(m.left===m.right){lb.classList.remove('selected');rb.classList.remove('selected');lb.classList.add('matched');rb.classList.add('matched');m.matched.add(m.left);document.getElementById(`gfb-${qi}`).textContent='✅ Parella correcta';if(m.matched.size===qx.pairs.length){g.answers[qi]=true;g.answered++;g.score++;updateGameScore(qi,true)}}else{lb.classList.add('bad');rb.classList.add('bad');document.getElementById(`gfb-${qi}`).textContent='❌ No corresponen. Prova una altra combinació.';setTimeout(()=>{lb.classList.remove('bad','selected');rb.classList.remove('bad','selected')},650)}m.left=null;m.right=null}};
function updateGameScore(qi,ok){const g=window.__activeGame;if(!g)return;document.getElementById('gameScore').textContent=`${g.score} / ${g.questions.length}`;const dots=document.querySelectorAll('#gameProgress .game-dot');if(dots[qi])dots[qi].classList.add(ok?'ok':'bad');if(g.answered===g.questions.length){const score=Math.round(g.score/g.questions.length*100);const tail=document.createElement('div');tail.className='notice '+(score>=70?'green':'');tail.style.marginTop='14px';tail.innerHTML=`<b>Resultado: ${g.score}/${g.questions.length}</b> · ${score>=80?'Muy buen dominio.':score>=60?'Conviene revisar los errores antes de cerrar la sesión.':'Necesita un repaso breve del contenido.'}`;document.querySelector('.game-shell').appendChild(tail)}}

window.openTeacher=id=>{const l=getLessonById(id);if(!l)return;const p=teacherPlan(l);document.getElementById("printModal").style.display="";openModal("Guía de la sesión",`${SUBJECTS[l.subject].name} · ${prettyDate(l.date)} · ${l.time}`,`<div class="teacher-plan"><div><span class="subject-chip ${SUBJECTS[l.subject].css}">SA ${l.unit+1}</span><h2>${esc(l.topic)}</h2>${carryNotice(l)}${aiNotice(l)}${l.compact?`<div class="notice blue" style="margin-bottom:10px"><b>⚡ Recuperación adaptativa activa.</b> Esta sesión reúne contenido de dos bloques para recuperar programación. Se priorizan explicaciones y ejercicios esenciales; no es necesario hacer todas las actividades de ambas páginas.</div>`:''}<div class="notice green"><b>Objetivo:</b> ${esc(objectiveFor(l))}</div><h3 style="margin-top:16px">Secuencia de 45 minutos</h3><div class="timeline">${p.steps.map(s=>`<div class="step"><div class="mins">${s[0]}</div><div>${esc(s[1])}</div></div>`).join('')}</div><h3 style="margin-top:16px">Qué observar</h3>${indicatorsFor(l).map(x=>`<div class="callout" style="margin:7px 0">✓ ${esc(x)}</div>`).join('')}</div><div><div class="callout"><b>Material de esta sesión</b><br>${esc(referenceFor(l))}<br><br><b>Uso del cuaderno de actividades</b><br>${l.type==='workbook'?'Sí: repaso después de terminar la unidad.':'No: en esta sesión se sigue el libro de texto y los ejercicios se hacen en la libreta.'}<br><br><b>Fase</b><br>${phaseLabel(l)}</div><div class="callout" style="margin-top:10px"><b>Dificultades previsibles</b><br>${esc(p.misconceptions)}</div><div class="callout" style="margin-top:10px"><b>Atención a la diversidad</b><br>${esc(p.support)}</div><button class="btn" style="margin-top:10px" onclick="openGame('${l.id}')">🎮 Abrir juego táctil</button></div></div>`)};

lout" style="margin-top:10px"><label style="display:flex;gap:8px;align-items:center;font-weight:800"><input type="checkbox" id="carryForward" ${st.carryForward?'checked':''} onchange="autoSaveCarryForward('${id}',this.checked)"> ➡️ Pasar pendiente a la siguiente sesión</label><div class="field" style="margin-top:8px"><textarea id="carryText" oninput="autoSaveCarryText('${id}',this.value)" placeholder="Ej.: Terminar ejercicios 7, 8 y 9 de la p. 21.">${esc(st.carryText||'')}</textarea></div><div class="tiny muted">Puedes usarlo manualmente o dejar que la IA lo rellene al aceptar una propuesta.</div></div><div class="notice green small" style="margin-top:10px"><b>✓ Guardado automático.</b> Cada cambio se guarda al instante y, si Firebase está conectado, se sincroniza también en la nube.</div></div><div class="card" style="box-shadow:none"><h3>Evaluación rápida</h3><p class="small muted">Trabajo: pulsa para alternar — / ✓ Trabajó bien / A Ausente. Nivel: — / 1 / 2 / 3. 1 = necesita ayuda · 2 = conseguido · 3 = dominio/autonomía.</p><div class="notice blue small">${indicatorsFor(l).map((x,i)=>`<b>Indicador ${i+1}:</b> ${esc(x)}<br>`).join('')}</div></div></div><div class="student-table-wrap" style="margin-top:14px"><table class="student-table"><thead><tr><th>#</th><th>Alumno/a</th><th>Trabajo</th><th>Nivel</th><th>Nota breve</th></tr></thead><tbody>${STUDENTS.map((s,i)=>studentRow(id,i,s,evid[i])).join('')}</tbody></table></div><div style="margin-top:12px"><button class="btn good" onclick="markAllDone('${id}')">✓ Todos han trabajado</button> <span class="small muted" style="margin-left:8px">No hace falta guardar: se registra automáticamente.</span></div></div>`)
};
function acceptedAIHTML(id,a){return `<div class="ai-proposal"><div class="ai-badge">🧠 Ajuste IA aceptado</div><p style="margin:8px 0 4px"><b>${esc(a.focus||a.summary||'Ajuste pedagógico')}</b></p><div class="small">${esc(a.reason||'')}</div>${a.minutes?`<div class="small" style="margin-top:5px">Tiempo recomendado: <b>${a.minutes} min</b></div>`:''}${a.shift_content?`<div class="small" style="margin-top:5px"><b>Reestructura la programación:</b> añade una sesión de refuerzo y desplaza el contenido posterior.</div>`:''}<button class="btn danger" style="margin-top:8px" onclick="removeAIAdjustment('${id}')">Quitar ajuste IA</button></div>`}
function proposalHTML(id,p){const actionLabel={none:"Sin cambio",carryover:"Pasar pendiente",brief_review:"Repaso breve",full_reinforcement:"Sesión completa de refuerzo"}[p.action]||p.action;return `<div class="ai-proposal"><div class="ai-badge">✨ Propuesta de la IA</div><h3 style="margin:8px 0 5px">${esc(actionLabel)}</h3><p class="small" style="margin:0 0 6px">${esc(p.summary||p.focus)}</p><div class="small"><b>Foco:</b> ${esc(p.focus||'—')}<br><b>Motivo:</b> ${esc(p.reason||'—')}${p.minutes?`<br><b>Tiempo:</b> ${p.minutes} min`:''}${p.shift_content?`<br><b>Programación:</b> desplazará una sesión de contenido nuevo.`:''}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn good" onclick="acceptAIProposal('${id}')">✓ Aceptar</button><button class="btn" onclick="rejectAIProposal()">No aplicar</button></div></div>`}
window.analyzeObservation=async id=>{const l=getLessonById(id),ta=document.getElementById("sessionNote"),box=document.getElementById("aiProposalBox");if(!l||!ta||!box)return;const observation=ta.value.trim();if(!observation){box.innerHTML='<div class="notice">Escribe o dicta primero una observación.</div>';return}box.innerHTML='<div class="ai-loading"><span class="spinner"></span><div><b>Analizando la observación…</b><div class="small muted">La IA valora si basta un recordatorio, conviene un repaso breve o hace falta una sesión extra.</div></div></div>';try{const raw=await callTeacherAI("observation",{...sessionAIPayload(l),observation,status:statusOf(id).status});const p=normalizeAIProposal(raw);window.__pendingAIProposal={id,proposal:p};box.innerHTML=proposalHTML(id,p)}catch(e){box.innerHTML=`<div class="notice"><b>⚠ No se pudo analizar.</b><br>${esc(e.message)}</div>`}};
window.acceptAIProposal=id=>{const pending=window.__pendingAIProposal;if(!pending||pending.id!==id)return;const p=pending.proposal;state.aiAdjustments=state.aiAdjustments||{};state.aiAdjustments[id]={...p,accepted:true,acceptedAt:new Date().toISOString()};const st=state.lessonStatus[id]||{status:"pending",note:""};if(p.action!=="none"&&p.carry_text){st.carryForward=true;st.carryText=p.carry_text}state.lessonStatus[id]=st;saveState();buildPlans();const box=document.getElementById("aiProposalBox");if(box)box.innerHTML=acceptedAIHTML(id,state.aiAdjustments[id]);const c=document.getElementById("carryForward"),t=document.getElementById("carryText");if(c)c.checked=!!st.carryForward;if(t)t.value=st.carryText||"";window.__pendingAIProposal=null};
window.rejectAIProposal=()=>{window.__pendingAIProposal=null;const b=document.getElementById("aiProposalBox");if(b)b.innerHTML='<div class="small muted">Propuesta no aplicada.</div>'};

let speechRecognition=null;
function stopDictation(){if(speechRecognition){try{speechRecognition.stop()}catch(_){ }speechRecognition=null}document.querySelectorAll('.mic-btn.listening').forEach(b=>{b.classList.remove('listening');b.textContent='🎙️ Dictar'})}
window.toggleDictation=id=>{if(speechRecognition){stopDictation();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Este navegador no ofrece reconocimiento de voz web. Prueba Chrome o Edge actualizado. Puedes seguir escribiendo la observación manualmente.");return}const ta=document.getElementById("sessionNote"),btn=document.getElementById(`micBtn-${id}`),status=document.getElementById(`micStatus-${id}`);if(!ta)return;const r=new SR();speechRecognition=r;r.lang="es-ES";r.continuous=true;r.interimResults=true;const base=ta.value.trim();let finalText="";r.onstart=()=>{if(btn){btn.classList.add('listening');btn.textContent='⏹ Parar'}if(status)status.textContent='Escuchando…'};r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript.trim();if(e.results[i].isFinal)finalText+=(finalText?' ':'')+txt;else interim+=(interim?' ':'')+txt}ta.value=[base,finalText,interim].filter(Boolean).join(base||finalText?' ':'');autoSaveSessionNote(id,ta.value)};r.onerror=e=>{if(status)status.textContent=`Micrófono: ${e.error}`};r.onend=()=>{speechRecognition=null;if(btn){btn.classList.remove('listening');btn.textContent='🎙️ Dictar'}if(status)status.textContent=''};try{r.start()}catch(e){speechRecognition=null;alert("No se pudo iniciar el micrófono: "+e.message)}};
function ensureEvidenceRow(id,i){state.evidence[id]=state.evidence[id]||{};state.evidence[id][i]=state.evidence[id][i]||{completion:"none",level:0,note:""};return state.evidence[id][i]}
function studentRow(id,i,name,e={}){const c=e?.completion||"none",lv=e?.level||0,n=e?.note||"";return `<tr><td>${i+1}</td><td class="student-name">${esc(name)}</td><td><button id="c-${i}" data-val="${c}" class="cycle ${c}" onclick="cycleCompletion('${id}',${i},this)">${c==='done'?'✓ Trabajó bien':c==='absent'?'A Ausente':'—'}</button></td><td><button id="l-${i}" data-val="${lv}" class="level ${lv?'l'+lv:''}" onclick="cycleLevel('${id}',${i},this)">${lv||'—'}</button></td><td><input id="n-${i}" value="${escAttr(n)}" oninput="autoSaveStudentNote('${id}',${i},this.value)" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:7px" placeholder="Opcional"></td></tr>`}
window.cycleCompletion=(id,i,b)=>{const row=ensureEvidenceRow(id,i);let v=b.dataset.val||row.completion||"none";v=v==="none"?"done":v==="done"?"absent":"none";b.dataset.val=v;b.className=`cycle ${v}`;b.textContent=v==="done"?"✓ Trabajó bien":v==="absent"?"A Ausente":"—";row.completion=v;saveState()};
window.cycleLevel=(id,i,b)=>{const row=ensureEvidenceRow(id,i);let v=+(b.dataset.val||row.level||0);v=(v+1)%4;b.dataset.val=v;b.className=`level ${v?'l'+v:''}`;b.textContent=v||"—";row.level=v;saveState()};
window.autoSaveStudentNote=(id,i,value)=>{const row=ensureEvidenceRow(id,i);row.note=value;saveState()};
window.markAllDone=id=>{STUDENTS.forEach((_,i)=>{const row=ensureEvidenceRow(id,i);row.completion="done";const b=document.getElementById(`c-${i}`);if(b){b.dataset.val="done";b.className="cycle done";b.textContent="✓ Trabajó bien"}});saveState()};
window.autoSaveSessionStatus=(id,status)=>{const prev=state.lessonStatus[id]||{};const l=getLessonById(id);state.lessonStatus[id]={...prev,status,note:prev.note||"",compactCredit:status==="done"&&l?.compact?1:0,updated:new Date().toISOString()};saveState();buildPlans()};
window.autoSaveSessionNote=(id,note)=>{const prev=state.lessonStatus[id]||{status:"pending"};state.lessonStatus[id]={...prev,status:prev.status||"pending",note,updated:new Date().toISOString()};saveState()};
window.autoSaveCarryForward=(id,checked)=>{const prev=state.lessonStatus[id]||{status:"pending",note:""};state.lessonStatus[id]={...prev,carryForward:checked,updated:new Date().toISOString()};saveState();buildPlans()};
window.autoSaveCarryText=(id,text)=>{const prev=state.lessonStatus[id]||{status:"pending",note:""};state.lessonStatus[id]={...prev,carryText:text,updated:new Date().toISOString()};saveState();buildPlans()};
window.saveEvidenceAndClose=id=>{closeModal();renderCurrent()};
window.saveSessionStatus=id=>{const status=document.getElementById("sessionStatus")?.value||"pending",note=document.getElementById("sessionNote")?.value||"",prev=state.lessonStatus[id]||{},l=getLessonById(id);state.lessonStatus[id]={...prev,status,note,compactCredit:status==="done"&&l?.compact?1:0,updated:new Date().toISOString()};saveState();buildPlans();closeModal();renderCurrent()};

function openReport(k,t,i){const name=STUDENTS[i],x=calcStudent(k,t,i);const score=x.score===null?"Sin datos suficientes":x.score.toFixed(1)+" / 10";const txt=feedbackText(k,t,i,x);openModal("Informe individual",`${name} · ${SUBJECTS[k].name} · ${BASE_CALENDAR.terms.find(q=>q.id===t).name}`,`<div class="worksheet"><div class="sheet-hero"><div><div class="subject-chip ${SUBJECTS[k].css}">${SUBJECTS[k].name}</div><div class="sheet-title">${esc(name)}</div><div class="sheet-meta">${BASE_CALENDAR.terms.find(q=>q.id===t).name}</div></div><div class="report-score">${score}</div></div><div class="grid cols-3"><div class="card metric"><div class="n">${x.mastery===null?'—':x.mastery.toFixed(1)}</div><div class="label">Dominio medio</div></div><div class="card metric"><div class="n">${x.comp===null?'—':Math.round(x.comp*10)}%</div><div class="label">Trabajo realizado</div></div><div class="card metric"><div class="n">${x.levels}</div><div class="label">Evidencias registradas</div></div></div><div class="card" style="margin-top:14px;box-shadow:none"><h3>Comentario generado a partir del registro</h3><p>${esc(txt)}</p></div><div class="notice">Este informe resume registros del profesor y propone una calificación orientativa. Debe revisarse antes de usarlo como información oficial de evaluación.</div></div>`)}
function feedbackText(k,t,i,x){if(x.score===null)return "Todavía no hay evidencias suficientes para emitir una valoración. Conviene registrar varias sesiones antes de interpretar el progreso.";let perf=x.score>=8.5?"muestra un dominio muy sólido":x.score>=7?"progresa adecuadamente y alcanza la mayoría de los aprendizajes":x.score>=5?"alcanza los aprendizajes esenciales, aunque necesita consolidar algunos contenidos":"necesita reforzar aprendizajes esenciales y recibir acompañamiento más frecuente";let comp=x.comp===null?"":x.comp>=9?" Mantiene una constancia muy alta en el trabajo diario.":x.comp>=7?" La realización del trabajo diario es generalmente constante.":" La realización del trabajo diario es irregular y conviene mejorar la continuidad del trabajo.";return `En ${SUBJECTS[k].name}, ${perf}.${comp} Se recomienda continuar registrando evidencias variadas y priorizar la retroalimentación concreta sobre los errores que se repiten.`}

function statusText(s){return s==="done"?"Realizada":s==="partial"?"Parcial":s==="missed"?"No realizada":"Pendiente"}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function escAttr(s){return esc(s).replace(/'/g,"&#39;")}

window.exportCSV=(k,t)=>{let rows=[["Alumno","Nota propuesta","Dominio","Trabajo diario","Evidencias"]];STUDENTS.forEach((n,i)=>{const x=calcStudent(k,t,i);rows.push([n,x.score?.toFixed(2)||"",x.mastery?.toFixed(2)||"",x.comp===null?"":Math.round(x.comp*10)+"%",x.levels])});const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");downloadBlob(csv,`informe_${k}_${t}_6B.csv`,`text/csv;charset=utf-8`)};
window.backupJSON=()=>downloadBlob(JSON.stringify(state,null,2),`aulaIA_6B_backup_${schoolTodayISO()}.json`,`application/json`);
window.restoreJSON=file=>{if(!file)return;const r=new FileReader();r.onload=()=>{try{state={...structuredClone(DEFAULT_STATE),...JSON.parse(r.result)};saveState();buildPlans();renderSettings();alert("Copia restaurada.")}catch(e){alert("El archivo no es válido.")}};r.readAsText(file)};
function downloadBlob(text,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// ---------- Firebase opcional ----------
async function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId)return;
  try{
    const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut},{getFirestore,doc,getDoc,setDoc}] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js")
    ]);
    const app=initializeApp(FIREBASE_CONFIG);firebase.auth=getAuth(app);firebase.db=getFirestore(app);firebase.api={signInWithEmailAndPassword,signOut,doc,getDoc,setDoc};
    onAuthStateChanged(firebase.auth,async user=>{
      firebase.user=user;
      if(user){
        firebase.docRef=doc(firebase.db,"users",user.uid,"classes",CLASS_ID);
        const snap=await getDoc(firebase.docRef);
        if(snap.exists()){
          state={...structuredClone(DEFAULT_STATE),...snap.data().state};
          seedKnownProgress(state);
          state.selectedDate=schoolTodayISO();
          localStorage.setItem("aulaIA6B",JSON.stringify(state));
        }else{
          state.selectedDate=schoolTodayISO();
          await setDoc(firebase.docRef,{state,updatedAt:new Date().toISOString()},{merge:true});
        }
        firebase.ready=true;
        updateSyncBox();
        buildPlans();
        renderCurrent();
      }else{
        firebase.ready=false;
        updateSyncBox();
      }
    })
  }catch(e){console.warn("Firebase no iniciado",e)}
}
async function saveRemote(){if(firebase.ready&&firebase.docRef){try{await firebase.api.setDoc(firebase.docRef,{state,updatedAt:new Date().toISOString()},{merge:true});setAutoSaveStatus("✓ Guardado en Firebase")}catch(e){console.warn(e);setAutoSaveStatus("⚠ Guardado local; fallo en Firebase")}}}
window.firebaseLogin=async()=>{if(!firebase.auth){alert("Firebase no ha podido inicializarse. Comprueba la conexión a Internet y la configuración del proyecto.");return}try{await firebase.api.signInWithEmailAndPassword(firebase.auth,document.getElementById("fbEmail").value,document.getElementById("fbPass").value);alert("Firebase conectado. A partir de ahora los cambios se guardarán también en la nube.")}catch(e){alert("No se pudo iniciar sesión: "+e.message)}};
window.firebaseLogout=async()=>{if(firebase.auth)await firebase.api.signOut(firebase.auth)};
function updateSyncBox(){const box=document.getElementById("syncBox");box.innerHTML=firebase.ready?`<span class="dot ok"></span><b>Firebase conectado</b><br>Sincronización activa para ${firebase.user?.email||'usuario autenticado'}.`:`<span class="dot"></span><b>Firebase preparado</b><br>Mientras no inicies sesión, los datos se guardan también de forma local en este navegador.`}

function debtCountAll(){return Object.keys(SUBJECTS).reduce((a,k)=>a+backlogBefore(k,addDays(state.selectedDate,1)),0)}

buildPlans();initFirebase();renderCurrent();
</script>
